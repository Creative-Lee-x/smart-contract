<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Contract</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,"Malgun Gothic",sans-serif;
  background:#EDF0F5;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.card{
  background:#fff;border-radius:16px;padding:36px 28px;width:100%;max-width:360px;
  box-shadow:0 6px 30px rgba(30,40,70,.12);text-align:center;
}
.card h1{font-size:20px;font-weight:800;color:#1E2430;margin-bottom:6px}
.card p{font-size:13px;color:#5A6475;margin-bottom:22px}
.card input{
  width:100%;padding:14px;border:1px solid #D8DEE9;border-radius:10px;
  font-size:18px;text-align:center;letter-spacing:6px;margin-bottom:12px;
}
.card input:focus{outline:none;border-color:#4A82E8;box-shadow:0 0 0 3px rgba(74,130,232,.15)}
.card button{
  width:100%;padding:14px;border:0;border-radius:10px;background:#4A82E8;color:#fff;
  font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
}
.card button:disabled{opacity:.6}
.err{color:#D64545;font-size:13px;margin-top:12px;display:none}
.game{
  background:#fff;border-radius:16px;padding:16px;width:100%;max-width:720px;
  box-shadow:0 6px 30px rgba(30,40,70,.12);
}
.game[hidden],.card[hidden]{display:none}
.game-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.game-head b{font-size:16px;color:#1E2430}
.game-head button{
  border:0;background:#F0F3F9;color:#1E2430;border-radius:8px;padding:8px 14px;
  font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
}
#dinoCanvas{width:100%;aspect-ratio:15/4;display:block;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
.game-hint{font-size:12px;color:#5A6475;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <h1>Smart Contract</h1>
  <p>비밀번호를 입력하세요</p>
  <input type="password" id="pw" inputmode="numeric" autocomplete="off" autofocus>
  <button id="btn" onclick="unlock()">열기</button>
  <div class="err" id="err">비밀번호가 올바르지 않습니다</div>
</div>
<div class="game" id="game" hidden>
  <div class="game-head">
    <b>Dino Run</b>
    <button type="button" id="gameExit">나가기</button>
  </div>
  <canvas id="dinoCanvas"></canvas>
  <div class="game-hint">화면을 탭하거나 스페이스바를 눌러 점프</div>
</div>

const ITER = 310000;

function b64d(s){
  const bin = atob(s);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function tryDecrypt(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64d(SALT), iterations:ITER, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(IV)}, key, b64d(DATA));
  return new TextDecoder().decode(pt);
}

/* 잠금 정책: 화면 이탈 시 즉시 리프레시, 10분 무활동 시 리프레시.
   비밀번호는 저장하지 않으므로 리프레시 = 재입력 */
const GUARD = "<scr" + "ipt>" +
  "document.addEventListener('visibilitychange',function(){if(document.hidden&&!window.__scHold){location.reload();}});" +
  "var __idleT;function __idleReset(){clearTimeout(__idleT);__idleT=setTimeout(function(){location.reload();},600000);}" +
  "['pointerdown','keydown','touchstart','scroll','input'].forEach(function(ev){document.addEventListener(ev,__idleReset,{passive:true});});" +
  "__idleReset();" +
  "<\/scr" + "ipt>";

async function unlock(){
  const pw = document.getElementById("pw").value;
  if(pw === "1111"){ startDino(); return; }
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");
  err.style.display = "none";
  btn.disabled = true; btn.textContent = "확인 중…";
  try{
    let html = await tryDecrypt(pw);
    if(html.includes("</body>")){
      html = html.replace("</body>", GUARD + "</body>");
    } else {
      html += GUARD;
    }
    document.open(); document.write(html); document.close();
  }catch(e){
    err.style.display = "block";
    btn.disabled = false; btn.textContent = "열기";
  }
}

document.getElementById("pw").addEventListener("keydown", e => { if(e.key === "Enter") unlock(); });

/* ───────── 이스터에그: 비밀번호 1111 → 공룡 달리기 ───────── */
function startDino(){
  const pw = document.getElementById("pw");
  pw.value = ""; pw.blur();
  document.querySelector(".card").hidden = true;
  document.getElementById("game").hidden = false;
  document.getElementById("gameExit").onclick = () => location.reload();
  runDino(document.getElementById("dinoCanvas"));
}

function runDino(cv){
  const W = 600, H = 160, GROUND = 146, P = 2, INK = "#535353";
  const ctx = cv.getContext("2d");
  let hi = 0;
  try{ hi = +localStorage.getItem("sc_dino_hi") || 0; }catch(e){}

  function resize(){
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(cv.clientWidth * dpr);
    cv.height = Math.round(cv.clientHeight * dpr);
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  let state, dino, obs, clouds, speed, dist, sinceSpawn, nextGap, overAt = 0, legT;
  function reset(){
    state = "ready";
    dino = {x: 30, y: GROUND - 48, vy: 0, air: false};
    obs = []; dist = 0; speed = 360; sinceSpawn = 0; nextGap = 420; legT = 0;
    clouds = [{x: 120, y: 30}, {x: 380, y: 52}, {x: 560, y: 24}];
  }
  reset();

  const score = () => Math.floor(dist / 40);
  function jump(){ if(!dino.air){ dino.vy = -620; dino.air = true; } }

  function spawn(){
    if(score() > 250 && Math.random() < 0.18){
      // 높은 새는 그냥 지나가고, 낮은 새는 점프
      const high = Math.random() < 0.5;
      obs.push({type: "bird", x: W + 10, w: 46, h: 30, y: high ? GROUND - 100 : GROUND - 58, f: 0});
    } else {
      const big = Math.random() < 0.45;
      const n = 1 + Math.floor(Math.random() * (speed > 520 ? 3 : 2));
      const cw = big ? 24 : 16, h = big ? 48 : 34;
      obs.push({type: "cactus", x: W + 10, n, cw, h, w: n * cw + (n - 1) * 2, y: GROUND - h});
    }
    const minGap = speed * 0.8 + 140;
    nextGap = minGap + Math.random() * minGap * 0.8;
  }

  function hit(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  function update(dt){
    if(state !== "running") return;
    dist += speed * dt;
    speed = Math.min(780, 360 + dist * 0.01);
    if(dino.air){
      dino.vy += 2000 * dt;
      dino.y += dino.vy * dt;
      if(dino.y >= GROUND - 48){ dino.y = GROUND - 48; dino.vy = 0; dino.air = false; }
    }
    legT += dt;
    for(const o of obs){
      o.x -= speed * dt * (o.type === "bird" ? 1.08 : 1);
      if(o.type === "bird") o.f += dt;
    }
    obs = obs.filter(o => o.x + o.w > -20);
    sinceSpawn += speed * dt;
    if(sinceSpawn >= nextGap){ sinceSpawn = 0; spawn(); }
    for(const c of clouds){
      c.x -= speed * 0.15 * dt;
      if(c.x < -60){ c.x = W + Math.random() * 120; c.y = 18 + Math.random() * 50; }
    }
    const body = {x: dino.x + 8, y: dino.y + 16, w: 26, h: 30};
    const head = {x: dino.x + 22, y: dino.y + 2, w: 18, h: 14};
    for(const o of obs){
      const box = o.type === "bird"
        ? {x: o.x + 4, y: o.y + 6, w: o.w - 8, h: o.h - 12}
        : {x: o.x + 3, y: o.y + 3, w: o.w - 6, h: o.h - 3};
      if(hit(body, box) || hit(head, box)){ gameOver(); break; }
    }
  }

  function gameOver(){
    state = "over"; overAt = performance.now();
    if(score() > hi){ hi = score(); try{ localStorage.setItem("sc_dino_hi", hi); }catch(e){} }
  }

  function drawDino(){
    const x = dino.x, y = dino.y;
    const r = (gx, gy, w, h) => ctx.fillRect(x + gx * P, y + gy * P, w * P, h * P);
    ctx.fillStyle = INK;
    r(11, 0, 10, 7);  r(11, 7, 6, 1);  r(9, 8, 8, 2);  r(4, 10, 12, 6);
    r(0, 7, 2, 5);    r(2, 9, 2, 6);   r(16, 11, 3, 1); r(18, 12, 1, 2);
    r(5, 16, 10, 2);
    const step = state === "running" && !dino.air ? Math.floor(legT * 10) % 2 : -1;
    r(6, 18, 3, step === 1 ? 3 : 6);
    r(12, 18, 3, step === 0 ? 3 : 6);
    ctx.fillStyle = "#fff"; r(13, 1, 2, 2);
    if(state === "over"){ ctx.fillStyle = INK; ctx.fillRect(x + 27, y + 3, 2, 2); }
  }

  function drawCactus(o){
    ctx.fillStyle = INK;
    for(let i = 0; i < o.n; i++){
      const cx = o.x + i * (o.cw + 2), top = o.y, h = o.h, cw = o.cw;
      const tw = Math.round(cw * 0.4), tx = cx + (cw - tw) / 2;
      const aw = Math.max(3, Math.round(cw * 0.18));
      ctx.fillRect(tx, top, tw, h);
      ctx.fillRect(cx, top + h * 0.25, aw, h * 0.35);
      ctx.fillRect(cx, top + h * 0.6 - aw, tx - cx, aw);
      ctx.fillRect(cx + cw - aw, top + h * 0.15, aw, h * 0.3);
      ctx.fillRect(tx + tw, top + h * 0.45 - aw, cx + cw - aw - (tx + tw), aw);
    }
  }

  function drawBird(o){
    ctx.fillStyle = INK;
    const x = o.x, y = o.y;
    ctx.fillRect(x, y + 10, 6, 3);
    ctx.fillRect(x + 4, y + 8, 8, 8);
    ctx.fillRect(x + 10, y + 12, 26, 7);
    ctx.fillRect(x + 36, y + 13, 10, 3);
    if(Math.floor(o.f * 6) % 2 === 0) ctx.fillRect(x + 16, y, 8, 12);
    else ctx.fillRect(x + 16, y + 19, 8, 11);
  }

  function drawCloud(c){
    ctx.beginPath();
    ctx.arc(c.x + 12, c.y + 8, 8, 0, 7);
    ctx.arc(c.x + 24, c.y + 4, 10, 0, 7);
    ctx.arc(c.x + 36, c.y + 8, 8, 0, 7);
    ctx.rect(c.x + 12, c.y + 8, 24, 8);
    ctx.fill();
  }

  function draw(){
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#E3E6EA"; clouds.forEach(drawCloud);
    ctx.fillStyle = INK;
    ctx.fillRect(0, GROUND - 1, W, 1);
    const off = dist % 600;
    for(let i = 0; i < 24; i++){
      const gx = ((i * 53 - off) % 600 + 600) % 600;
      ctx.fillRect(gx, GROUND + 4 + (i % 3) * 3, (i % 4) + 1, 1);
    }
    for(const o of obs) o.type === "bird" ? drawBird(o) : drawCactus(o);
    drawDino();
    const pad = n => String(n).padStart(5, "0");
    ctx.fillStyle = INK;
    ctx.textAlign = "right";
    ctx.font = "bold 13px ui-monospace, Menlo, Consolas, monospace";
    ctx.fillText("HI " + pad(hi) + "  " + pad(score()), W - 10, 22);
    ctx.textAlign = "center";
    if(state === "ready"){
      ctx.font = "bold 15px -apple-system, 'Malgun Gothic', sans-serif";
      ctx.fillText("탭하거나 스페이스바를 눌러 시작", W / 2, 72);
    } else if(state === "over"){
      ctx.font = "bold 20px ui-monospace, Menlo, Consolas, monospace";
      ctx.fillText("G A M E   O V E R", W / 2, 62);
      ctx.font = "13px -apple-system, 'Malgun Gothic', sans-serif";
      ctx.fillText("탭해서 다시 시작", W / 2, 86);
    }
  }

  function press(){
    if(state === "ready"){ state = "running"; jump(); }
    else if(state === "running") jump();
    else if(performance.now() - overAt > 400){ reset(); state = "running"; jump(); }
  }
  cv.addEventListener("pointerdown", e => { e.preventDefault(); press(); });
  document.addEventListener("keydown", e => {
    if(e.code === "Space" || e.code === "ArrowUp"){ e.preventDefault(); press(); }
  });

  let last = performance.now();
  function loop(t){
    const dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
