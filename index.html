<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Contract</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,"Malgun Gothic",sans-serif;
  background:#EDF0F5;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.card{
  background:#fff;border-radius:16px;padding:36px 28px;width:100%;max-width:360px;
  box-shadow:0 6px 30px rgba(30,40,70,.12);text-align:center;
}
.card h1{font-size:20px;font-weight:800;color:#1E2430;margin-bottom:6px}
.card p{font-size:13px;color:#5A6475;margin-bottom:22px}
.card input{
  width:100%;padding:14px;border:1px solid #D8DEE9;border-radius:10px;
  font-size:18px;text-align:center;letter-spacing:6px;margin-bottom:12px;
}
.card input:focus{outline:none;border-color:#4A82E8;box-shadow:0 0 0 3px rgba(74,130,232,.15)}
.card button{
  width:100%;padding:14px;border:0;border-radius:10px;background:#4A82E8;color:#fff;
  font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
}
.card button:disabled{opacity:.6}
.err{color:#D64545;font-size:13px;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>Smart Contract</h1>
  <p>비밀번호를 입력하세요</p>
  <input type="password" id="pw" inputmode="numeric" autocomplete="off" autofocus>
  <button id="btn" onclick="unlock()">열기</button>
  <div class="err" id="err">비밀번호가 올바르지 않습니다</div>
</div>

const ITER = 310000;

function b64d(s){
  const bin = atob(s);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function tryDecrypt(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64d(SALT), iterations:ITER, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(IV)}, key, b64d(DATA));
  return new TextDecoder().decode(pt);
}

/* 잠금 정책: 화면 이탈 시 즉시 리프레시, 10분 무활동 시 리프레시.
   비밀번호는 저장하지 않으므로 리프레시 = 재입력 */
const GUARD = "<scr" + "ipt>" +
  "document.addEventListener('visibilitychange',function(){if(document.hidden&&!window.__scHold){location.reload();}});" +
  "var __idleT;function __idleReset(){clearTimeout(__idleT);__idleT=setTimeout(function(){location.reload();},600000);}" +
  "['pointerdown','keydown','touchstart','scroll','input'].forEach(function(ev){document.addEventListener(ev,__idleReset,{passive:true});});" +
  "__idleReset();" +
  "<\/scr" + "ipt>";

async function unlock(){
  const pw = document.getElementById("pw").value;
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");
  err.style.display = "none";
  btn.disabled = true; btn.textContent = "확인 중…";
  try{
    let html = await tryDecrypt(pw);
    if(html.includes("</body>")){
      html = html.replace("</body>", GUARD + "</body>");
    } else {
      html += GUARD;
    }
    document.open(); document.write(html); document.close();
  }catch(e){
    err.style.display = "block";
    btn.disabled = false; btn.textContent = "열기";
  }
}

document.getElementById("pw").addEventListener("keydown", e => { if(e.key === "Enter") unlock(); });
</script>
